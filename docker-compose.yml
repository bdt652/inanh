services:
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      # CORS configuration for direct browser uploads
      MINIO_CORS_ALLOWEDORIGINS: ${MINIO_CORS_ALLOWEDORIGINS:-}
      MINIO_CORS_ALLOWEDMETHODS: ${MINIO_CORS_ALLOWEDMETHODS:-GET,PUT,POST,HEAD}
      MINIO_CORS_ALLOWEDHEADERS: ${MINIO_CORS_ALLOWEDHEADERS:-*}
      MINIO_CORS_MAXAGESECONDS: ${MINIO_CORS_MAXAGESECONDS:-3000}
    volumes:
      - minio-data:/data
    networks:
      default:
        aliases:
          - media.inanh24h.com

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME:-inanh24h}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-inanh24h-media}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    ports:
      - "8000:8000"
    depends_on:
      - minio
    volumes:
      - api-uploads:/app/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://inanh24h.com}
        NEXT_PUBLIC_UPLOAD_MODE: ${NEXT_PUBLIC_UPLOAD_MODE:-direct}
        NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL:-}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000/api/v1}
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://inanh24h.com}
      NEXT_PUBLIC_UPLOAD_MODE: ${NEXT_PUBLIC_UPLOAD_MODE:-direct}
      NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  minio-data:
  api-uploads:
