name: Build and Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: inanh24h-production
  cancel-in-progress: false

env:
  IMAGE: docker.io/bdt652/inanh

jobs:
  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -v

  build:
    name: Build and Push Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:api-${{ github.sha }}
            ${{ env.IMAGE }}:api
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:web-${{ github.sha }}
            ${{ env.IMAGE }}:web
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.inanh24h.com/api/v1
            NEXT_PUBLIC_BACKEND_URL=https://api.inanh24h.com
            NEXT_PUBLIC_SITE_URL=https://inanh24h.com
            NEXT_PUBLIC_UPLOAD_MODE=presigned
            NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL=https://media.inanh24h.com/inanh24h-media
            API_INTERNAL_URL=http://api:8000/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on:
      - self-hosted
      - Linux
      - X64
      - inanh24h
    steps:
      - name: Deploy API
        run: |
          sudo -n /usr/local/sbin/deploy-inanh24h api "$GITHUB_SHA"

      - name: Deploy Web
        run: |
          sudo -n /usr/local/sbin/deploy-inanh24h web "$GITHUB_SHA"
