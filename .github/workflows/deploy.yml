name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-inanh24h
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: docker.io/bdt652/inanh
  K8S_NAMESPACE: inanh24h

jobs:
  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -v

  build-push:
    name: Build & push Docker images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY_IMAGE }}:api
            ${{ env.REGISTRY_IMAGE }}:api-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.inanh24h.com/api/v1' }}
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || 'https://api.inanh24h.com' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://inanh24h.com' }}
            NEXT_PUBLIC_UPLOAD_MODE=${{ vars.NEXT_PUBLIC_UPLOAD_MODE || 'presigned' }}
            NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_MINIO_PUBLIC_BASE_URL || 'https://media.inanh24h.com/inanh24h-media' }}
            API_INTERNAL_URL=${{ vars.API_INTERNAL_URL || 'http://api:8000/api/v1' }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:web
            ${{ env.REGISTRY_IMAGE }}:web-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s (machine 108)
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Create image pull secret
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} create secret docker-registry regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply manifests
        # NOTE: 01-secrets.yaml is excluded on purpose. The secret holds real
        # credentials (MongoDB/MinIO/AI keys) and must be created manually on the
        # cluster once (kubectl create secret ...). CI never applies placeholders.
        run: |
          for f in deploy/k8s/00-namespace.yaml deploy/k8s/02-configmap-api.yaml deploy/k8s/03-configmap-web.yaml deploy/k8s/10-api-deployment.yaml deploy/k8s/11-api-service.yaml deploy/k8s/20-web-deployment.yaml deploy/k8s/21-web-service.yaml deploy/k8s/30-cert-issuer.yaml deploy/k8s/31-ingress-api.yaml deploy/k8s/32-ingress-web.yaml; do
            kubectl apply -f "$f"
          done
      - name: Update images
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image deployment/api api=${{ env.REGISTRY_IMAGE }}:api-${{ github.sha }}
          kubectl -n ${{ env.K8S_NAMESPACE }} set image deployment/web web=${{ env.REGISTRY_IMAGE }}:web-${{ github.sha }}
      - name: Wait for rollout
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/api --timeout=180s
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/web --timeout=180s
