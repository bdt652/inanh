# cert-manager ClusterIssuer for Let's Encrypt.
# Test with STAGING first to avoid rate limits, then switch to production:
#   server: https://acme-v02.api.letsencrypt.org/directory
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-inanh24h
spec:
  acme:
    # Staging endpoint (no rate limit, cert NOT trusted by browsers):
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Production endpoint (uncomment for real TLS):
    # server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@inanh24h.com
    privateKeySecretRef:
      name: letsencrypt-inanh24h-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
