apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-inanh24h-tls
  namespace: inanh24h
spec:
  secretName: api-inanh24h-tls
  dnsNames:
    - api.inanh24h.com
  issuerRef:
    name: letsencrypt-inanh24h
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-inanh24h
  namespace: inanh24h
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.inanh24h.com`)
      kind: Rule
      services:
        - name: api
          port: 8000
  tls:
    secretName: api-inanh24h-tls
