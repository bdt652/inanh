apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: inanh24h-tls
  namespace: inanh24h
spec:
  secretName: inanh24h-tls
  dnsNames:
    - inanh24h.com
    - www.inanh24h.com
  issuerRef:
    name: letsencrypt-inanh24h
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: inanh24h-www-redirect
  namespace: inanh24h
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.inanh24h.com`)
      kind: Rule
      services:
        - name: web
          port: 3000
  tls:
    secretName: inanh24h-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: inanh24h
  namespace: inanh24h
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`inanh24h.com`)
      kind: Rule
      services:
        - name: web
          port: 3000
  tls:
    secretName: inanh24h-tls
---
# Redirect plain HTTP -> HTTPS via Traefik middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: inanh24h
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: inanh24h-http
  namespace: inanh24h
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`inanh24h.com`) || Host(`www.inanh24h.com`) || Host(`api.inanh24h.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: web
          port: 3000
